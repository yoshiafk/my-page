apiVersion: v1
kind: Secret
metadata:
  name: insurance-secrets
type: Opaque
stringData:
  DATABASE_URL: "postgresql://admin:password@localhost:5432/insurance_platform"
  OIDC_CLIENT_ID: "your-client-id"
  OIDC_CLIENT_SECRET: "your-client-secret"
  JWT_SECRET: "your-jwt-secret"
  LIFERAY_API_USER: "liferay-user"
  LIFERAY_API_PASSWORD: "liferay-password"
