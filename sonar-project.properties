#------------------------------------------------------------------------------  
# REQUIRED: unique project identifier  
#------------------------------------------------------------------------------  
sonar.projectKey=aii.mypage-liferay  

#------------------------------------------------------------------------------  
# PROJECT INFORMATION
#------------------------------------------------------------------------------  
sonar.projectName=AXA MyPage Liferay Application
sonar.projectVersion=1.18.1
sonar.sourceEncoding=UTF-8

#------------------------------------------------------------------------------  
# SOURCE CODE CONFIGURATION
#------------------------------------------------------------------------------  
# Full default language analysis (Java/JS/SQL/etc) with build folders excluded
# Exclusions added: generated API modules, service-builder generated code, test sources, node/dist/minified/vendor files,
# and common build output folders to reduce noise and avoid counting generated LOC.
# NOTE: tests and integration-tests are excluded from Sonar analysis to avoid false positives on test-only assertions
sonar.exclusions=**/build/**,**/gradle/**,**/TestResults/**,**/src/test/**,**/*Test.java,**/*IT.java,**/node_modules/**,**/dist/**,**/*.min.js,**/*.min.css,**/*.map,**/target/**,**/*-api/**/src/main/java/**,**/modules/**/**/service/base/**,**/modules/**/**/service/persistence/**,**/themes/**/src/**/dist/**,**/themes/**/node_modules/**

# Explicitly exclude test files (ensure test-only files are ignored)
sonar.test.exclusions=**/src/test/**,**/*Test.java,**/*IT.java

# JaCoCo coverage report paths
sonar.coverage.jacoco.xmlReportPaths=**/build/reports/jacoco/test/jacocoTestReport.xml,**/build/reports/jacoco/**/*.xml

#------------------------------------------------------------------------------  
# SQL AND PL/SQL CONFIGURATION  
#------------------------------------------------------------------------------  
# Enable SQL language support
sonar.lang.patterns.sql=**/*.sql,**/*.pls,**/*.plsql,**/*.pks,**/*.pkb
# SQL file suffixes (if using different extensions)
sonar.sql.file.suffixes=.sql,.pls,.plsql,.pks,.pkb

#------------------------------------------------------------------------------  
# MODULE SPECIFIC CONFIGURATIONS
#------------------------------------------------------------------------------  
# Note: Java-specific configurations removed since Java analysis is excluded

#------------------------------------------------------------------------------  
# OPTIONAL: if you ever do scan some JS, point to your Node binary  
#------------------------------------------------------------------------------  
sonar.nodejs.executable=/usr/local/bin/node  

#------------------------------------------------------------------------------  
# TUNE: allow 5 min for the scanner to talk to the server  
#------------------------------------------------------------------------------  
sonar.ws.timeout=300  
