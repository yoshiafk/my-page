pluginManagement {
	repositories {
		maven {
			url "https://artifactory.asia.axa-cloud.com/artifactory/ext-repository-liferay-com/"
			credentials {
				username = System.getProperty('artifactory_user', 'default')
				password = System.getProperty('artifactory_password', 'default')
			}
		}
		gradlePluginPortal()
	}
}

buildscript {
	dependencies {
		classpath group: "biz.aQute.bnd", name: "biz.aQute.bnd", version: "5.2.0"
		classpath(group: "com.liferay", name: "com.liferay.gradle.plugins.workspace", version: "4.0.9") {
			exclude group: "biz.aQute.bnd", module: "biz.aQute.bnd"
		}
		classpath group: "net.saliman", name: "gradle-properties-plugin", version: "1.4.6"
	}

	repositories {
		maven {
			url "https://artifactory.asia.axa-cloud.com/artifactory/ext-repository-liferay-com/"
			credentials {
				username = System.getProperty('artifactory_user', 'default')
				password = System.getProperty('artifactory_password', 'default')
			}
		}
	}
}

apply plugin: "net.saliman.properties"

// Comment out Liferay workspace plugin to avoid dependency issues
// apply plugin: "com.liferay.workspace"

// ============================================================================
